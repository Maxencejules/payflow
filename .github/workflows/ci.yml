name: Payment engine checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  postgres:
    name: PostgreSQL ${{ matrix.postgres }} payment invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        postgres: ['15', '16']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: payflow_test
          POSTGRES_USER: pay_test
          POSTGRES_PASSWORD: pay_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pay_test -d payflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/payflow_test
      DB_USERNAME: pay_test
      DB_PASSWORD: pay_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify database transactions and build the runnable jar
        run: ./gradlew --no-daemon test bootJar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-${{ matrix.postgres }}-proof
          path: |
            build/test-results/test/
            build/reports/tests/test/
