name: Payment engine checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  postgres:
    name: PostgreSQL ${{ matrix.postgres }} payment invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ['15', '16']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: payflow_test
          POSTGRES_USER: pay_test
          POSTGRES_PASSWORD: pay_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pay_test -d payflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/payflow_test
      DB_USERNAME: pay_test
      DB_PASSWORD: pay_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify database transactions and build the runnable jar
        run: ./gradlew --no-daemon test bootJar
      - name: Real HTTP demo and persisted receipt replay after restart
        shell: bash
        run: |
          mkdir -p build/demo
          app_pid=""
          cleanup() {
            if [[ -n "$app_pid" ]]; then
              kill "$app_pid" 2>/dev/null || true
              wait "$app_pid" 2>/dev/null || true
              app_pid=""
            fi
          }
          trap cleanup EXIT
          start_app() {
            java -jar build/libs/payflow.jar > "build/demo/app-$1.log" 2>&1 &
            app_pid=$!
            for attempt in {1..60}; do
              if curl --fail --silent http://127.0.0.1:8080/api/v1/payments/health > /dev/null; then
                return
              fi
              if ! kill -0 "$app_pid" 2>/dev/null; then break; fi
              sleep 1
            done
            cat "build/demo/app-$1.log"
            exit 1
          }
          start_app initial
          python scripts/demo.py --output build/demo/proof.json
          cleanup
          start_app restarted
          python scripts/demo.py --verify-receipts build/demo/proof.json | tee build/demo/restart-proof.json
      - name: Build the runtime container from the executable jar
        if: matrix.postgres == '15'
        run: docker build --tag payflow:ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-${{ matrix.postgres }}-proof
          path: |
            build/test-results/test/
            build/reports/tests/test/
            build/demo/
