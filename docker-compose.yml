version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: payflow-db
    environment:
      POSTGRES_DB: payflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - payflow-network

  api:
    build: .
    container_name: payflow-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/payflow
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SPRING_PROFILES_ACTIVE: docker
      BIND_ADDRESS: 0.0.0.0
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - payflow-network

volumes:
  postgres_data:

networks:
  payflow-network:
    driver: bridge
